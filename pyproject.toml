[project]
name = "ddbot"
version = "0.1.0"
description = "Telegram channel publishing and management bot"
requires-python = ">=3.11"
dependencies = [
  "aiogram==3.30.0",
  "aiosqlite==0.22.1",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
ddbot = "ddbot.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
